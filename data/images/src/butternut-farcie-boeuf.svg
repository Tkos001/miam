<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FFF4E3"/>
      <stop offset="100%" stop-color="#F0D8B8"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE6DC"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9A95C"/>
      <stop offset="100%" stop-color="#C97A2E"/>
    </linearGradient>
    <linearGradient id="flesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC56A"/>
      <stop offset="100%" stop-color="#F5A233"/>
    </linearGradient>
    <linearGradient id="meat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A4A2B"/>
      <stop offset="100%" stop-color="#6E3119"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF1B0"/>
      <stop offset="100%" stop-color="#F2C84B"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- nappe : légères rayures -->
  <g opacity="0.08" fill="#A5602A">
    <rect x="0" y="0" width="1200" height="40"/>
    <rect x="0" y="760" width="1200" height="40"/>
  </g>

  <!-- ombre de l'assiette -->
  <ellipse cx="610" cy="470" rx="430" ry="245" fill="#8B5A2B" opacity="0.28" filter="url(#soft)"/>

  <!-- assiette -->
  <ellipse cx="600" cy="440" rx="430" ry="245" fill="url(#plate)"/>
  <ellipse cx="600" cy="440" rx="430" ry="245" fill="none" stroke="#D9CFC1" stroke-width="4"/>
  <ellipse cx="600" cy="440" rx="365" ry="200" fill="none" stroke="#E6DDD0" stroke-width="3"/>

  <!-- ============ demi-courge arrière (droite) ============ -->
  <g transform="translate(690 300) rotate(-18)">
    <!-- ombre -->
    <path d="M -210 70 C -220 -30 -150 -110 -40 -100 C 90 -90 230 -50 240 40 C 250 130 160 190 20 190 C -110 190 -200 160 -210 70 Z"
          fill="#6B3A12" opacity="0.25" transform="translate(10 18)" filter="url(#soft)"/>
    <!-- peau -->
    <path d="M -210 70 C -220 -30 -150 -110 -40 -100 C 90 -90 230 -50 240 40 C 250 130 160 190 20 190 C -110 190 -200 160 -210 70 Z"
          fill="url(#skin)"/>
    <!-- chair -->
    <path d="M -180 70 C -190 -10 -130 -80 -40 -72 C 80 -62 200 -30 208 40 C 215 115 140 160 20 160 C -95 160 -170 135 -180 70 Z"
          fill="url(#flesh)"/>
    <!-- cavité -->
    <ellipse cx="60" cy="55" rx="130" ry="80" fill="#D98A2B"/>
    <!-- farce -->
    <ellipse cx="60" cy="50" rx="122" ry="72" fill="url(#meat)"/>
    <g fill="#B0583A">
      <circle cx="10" cy="40" r="11"/><circle cx="50" cy="70" r="9"/><circle cx="95" cy="35" r="12"/>
      <circle cx="130" cy="65" r="8"/><circle cx="-20" cy="68" r="8"/><circle cx="75" cy="88" r="7"/>
    </g>
    <g fill="#C9302C">
      <circle cx="35" cy="22" r="7"/><circle cx="115" cy="78" r="6"/><circle cx="-5" cy="52" r="5"/>
    </g>
    <!-- fromage gratiné -->
    <path d="M -60 40 C -40 5 10 -5 60 -2 C 120 2 170 20 180 48 C 150 40 125 58 100 50 C 70 40 60 70 35 62 C 10 55 -5 75 -30 62 C -45 54 -62 60 -60 40 Z"
          fill="url(#cheese)"/>
    <g fill="#D99A2B" opacity="0.9">
      <circle cx="-20" cy="35" r="6"/><circle cx="60" cy="18" r="7"/><circle cx="140" cy="38" r="6"/><circle cx="20" cy="55" r="4"/>
    </g>
  </g>

  <!-- ============ demi-courge avant (gauche) ============ -->
  <g transform="translate(470 420) rotate(12)">
    <path d="M -260 60 C -265 -40 -180 -120 -60 -110 C 90 -98 260 -60 270 50 C 280 160 170 220 10 220 C -140 220 -250 180 -260 60 Z"
          fill="#6B3A12" opacity="0.28" transform="translate(12 22)" filter="url(#soft)"/>
    <path d="M -260 60 C -265 -40 -180 -120 -60 -110 C 90 -98 260 -60 270 50 C 280 160 170 220 10 220 C -140 220 -250 180 -260 60 Z"
          fill="url(#skin)"/>
    <!-- reflet peau -->
    <path d="M -230 40 C -225 -30 -160 -85 -60 -82 C 20 -78 90 -65 150 -45 C 60 -70 -40 -75 -120 -40 C -180 -12 -215 10 -230 40 Z"
          fill="#FFFFFF" opacity="0.18"/>
    <path d="M -222 60 C -226 -20 -155 -88 -60 -80 C 80 -68 230 -38 238 50 C 245 140 150 185 10 185 C -125 185 -215 150 -222 60 Z"
          fill="url(#flesh)"/>
    <ellipse cx="40" cy="60" rx="165" ry="100" fill="#D98A2B"/>
    <ellipse cx="40" cy="54" rx="155" ry="90" fill="url(#meat)"/>
    <g fill="#B0583A">
      <circle cx="-40" cy="40" r="13"/><circle cx="20" cy="85" r="11"/><circle cx="90" cy="30" r="14"/>
      <circle cx="140" cy="80" r="10"/><circle cx="-90" cy="75" r="9"/><circle cx="60" cy="112" r="9"/>
      <circle cx="-10" cy="10" r="8"/><circle cx="120" cy="115" r="7"/>
    </g>
    <g fill="#C9302C">
      <circle cx="-15" cy="60" r="8"/><circle cx="110" cy="55" r="7"/><circle cx="50" cy="20" r="6"/><circle cx="-70" cy="30" r="6"/>
    </g>
    <!-- oignon/ail : petits éclats clairs -->
    <g fill="#F3D9A4" opacity="0.9">
      <rect x="-55" y="95" width="16" height="6" rx="3" transform="rotate(-20 -47 98)"/>
      <rect x="70" y="90" width="18" height="6" rx="3" transform="rotate(25 79 93)"/>
      <rect x="150" y="40" width="14" height="6" rx="3" transform="rotate(-35 157 43)"/>
    </g>
    <!-- fromage gratiné qui coule -->
    <path d="M -110 45 C -80 -5 -10 -18 60 -12 C 140 -6 200 20 210 60 C 180 48 150 75 120 62 C 85 48 78 90 45 80 C 15 72 0 100 -35 85 C -60 75 -85 95 -105 78 C -118 66 -125 60 -110 45 Z"
          fill="url(#cheese)"/>
    <!-- coulure -->
    <path d="M 175 95 C 185 115 170 140 160 125 C 155 115 165 100 175 95 Z" fill="#F2C84B"/>
    <g fill="#D99A2B" opacity="0.95">
      <circle cx="-60" cy="35" r="8"/><circle cx="30" cy="8" r="9"/><circle cx="150" cy="40" r="8"/><circle cx="90" cy="55" r="5"/><circle cx="-20" cy="60" r="5"/>
    </g>
    <!-- reflet fromage -->
    <path d="M -70 30 C -40 10 20 2 70 4" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- persil -->
  <g fill="#4E9A3B">
    <ellipse cx="390" cy="300" rx="14" ry="7" transform="rotate(-30 390 300)"/>
    <ellipse cx="405" cy="292" rx="12" ry="6" transform="rotate(30 405 292)"/>
    <ellipse cx="760" cy="520" rx="13" ry="6" transform="rotate(-20 760 520)"/>
    <ellipse cx="775" cy="528" rx="11" ry="6" transform="rotate(40 775 528)"/>
    <ellipse cx="560" cy="595" rx="12" ry="6" transform="rotate(10 560 595)"/>
  </g>
  <g fill="#3B7A2E">
    <ellipse cx="398" cy="304" rx="5" ry="3"/>
    <ellipse cx="768" cy="524" rx="5" ry="3"/>
  </g>

  <!-- vapeur -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <path d="M 520 190 C 500 160 540 140 520 110"/>
    <path d="M 580 170 C 560 140 600 120 580 90"/>
    <path d="M 640 190 C 620 160 660 140 640 110"/>
  </g>

  <!-- fourchette -->
  <g transform="translate(1030 300) rotate(35)" fill="#C8CCD2" stroke="#9AA0A8" stroke-width="3">
    <rect x="-9" y="-10" width="18" height="300" rx="9"/>
    <path d="M -34 -100 L -34 -10 Q -34 10 -14 10 L 14 10 Q 34 10 34 -10 L 34 -100 L 20 -100 L 20 -30 L 8 -30 L 8 -100 L -8 -100 L -8 -30 L -20 -30 L -20 -100 Z"/>
  </g>
</svg>
